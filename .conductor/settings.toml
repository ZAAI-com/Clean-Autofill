"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

# Conductor repository settings for Clean-Autofill, a Chrome MV3 extension.
#
# There is no dev server in this repo and nothing binds a port, so no script
# uses CONDUCTOR_PORT. The loop is: build dist/, then load or reload it as an
# unpacked extension at chrome://extensions.
#
# Every command below runs a bash script from .conductor/scripts. They are
# invoked through "bash" rather than "./" so a lost executable bit cannot break
# workspace creation, and each one bootstraps its own PATH, because Conductor
# runs scripts in a non-interactive shell that reads no rc file. This repo needs
# bun AND node AND npx: toolkit/scripts/build.js is a CommonJS Node script that
# shells out to "npx tsc" and "npx esbuild".

[scripts]
setup = "bash .conductor/scripts/setup.sh"
archive = "bash .conductor/scripts/archive.sh"

# Nothing here is exclusive across workspaces: no port, no daemon, no shared
# database. Each worktree writes only to its own node_modules/ and dist/, and
# manifest.json has no "key" field, so unpacked builds loaded from different
# folders get different Chrome extension IDs and can coexist in one profile.
# "nonconcurrent" would stop a test watcher in one workspace the moment another
# workspace pressed a run button, which is exactly wrong for parallel work.
run_mode = "concurrent"

# setup.sh already installs and builds, so there is nothing left to start.
auto_run_after_setup = false

# The everyday loop: recompile TypeScript, bundle, copy assets into dist/,
# then print the folder to reload in Chrome.
[scripts.run.build]
command = "bash .conductor/scripts/run.sh build"
icon = "package"
default = true

# The pre-PR gate. Same steps in the same order as
# .github/workflows/W1-Test.yml, so green here should mean green in CI.
[scripts.run.verify]
command = "bash .conductor/scripts/run.sh verify"
icon = "test-tube"

# The only genuinely long running command in this repo.
[scripts.run.test-watch]
command = "bash .conductor/scripts/run.sh watch"
icon = "flame"

# Build plus zip for a Chrome Web Store upload. Needs the system zip binary,
# and the artifact is only useful on the machine that uploads it.
[scripts.run.pack]
command = "bash .conductor/scripts/run.sh pack"
icon = "rocket"
available_in = "local"
