version: 2

updates:
  # Bun uses the npm ecosystem; Dependabot reads bun.lock.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: Bump
    groups:
      # One PR for routine patch and minor bumps, individual PRs for majors
      # so each breaking change can be reviewed and reverted on its own.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: Bump
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
