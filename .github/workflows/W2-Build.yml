name: W2 Build

on:
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies
      run: bun install

    - name: Package extension
      run: bun run pack

    - name: Upload extension artifact
      uses: actions/upload-artifact@v7
      with:
        name: Clean-Autofill
        path: dist/chromium/*.zip
        retention-days: 30

    - name: Generate build report
      run: |
        VERSION=$(python3 -c "import json; print(json.load(open('src/manifest.json'))['version'])")
        ZIP_PATH="dist/chromium/Clean-Autofill-$VERSION.zip"
        SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/tmp/build-report.md}"
        {
          echo "## Build Report"
          echo ""
          echo "### Extension Details"
          echo "- **Package**: $ZIP_PATH"
          echo "- **Size**: $(du -h "$ZIP_PATH" | cut -f1)"
          echo "- **Files**: $(unzip -l "$ZIP_PATH" | tail -1 | awk '{print $2}')"
          echo ""
          echo "### Manifest Info"
          python3 <<'PY'
import json
with open('src/manifest.json', 'r') as f:
    m = json.load(f)
    print(f"- **Version**: {m.get('version')}")
    print(f"- **Name**: {m.get('name')}")
    print(f"- **Permissions**: {', '.join(m.get('permissions', []))}")
PY
        } >> "$SUMMARY_FILE"
