name: W3 Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to Chrome Web Store after upload'
        required: true
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/W1-Test.yml

  build:
    needs: ci
    uses: ./.github/workflows/W2-Build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract and validate version
        id: version
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('src/manifest.json'))['version'])")
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"

          PKG_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match src/manifest.json version ($MANIFEST_VERSION)"
            exit 1
          fi

          echo "Release version: $MANIFEST_VERSION"

      - name: Read Chrome Web Store configuration
        id: config
        run: |
          EXTENSION_ID=$(python3 -c "import json; print(json.load(open('package.json'))['chromeWebStore']['extensionId'])")
          PUBLISHER_ID="${{ vars.CHROME_WEB_STORE_PUBLISHER_ID }}"
          if [ -z "$EXTENSION_ID" ] || [ "$EXTENSION_ID" = "<EXTENSION_ID>" ]; then
            echo "::error::Chrome Web Store extension ID not configured in package.json"
            exit 1
          fi
          if [ -z "$PUBLISHER_ID" ]; then
            echo "::error::Chrome Web Store publisher ID not configured in the CHROME_WEB_STORE_PUBLISHER_ID Actions variable"
            exit 1
          fi
          echo "extension_id=$EXTENSION_ID" >> "$GITHUB_OUTPUT"
          echo "publisher_id=$PUBLISHER_ID" >> "$GITHUB_OUTPUT"

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: Clean-Autofill
          path: dist/chromium

      - name: Upload to Chrome Web Store
        id: upload
        env:
          CHROME_WEB_STORE_CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CHROME_WEB_STORE_CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          CHROME_WEB_STORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
        run: |
          MISSING=""
          [ -z "$CHROME_WEB_STORE_CLIENT_ID" ] && MISSING="$MISSING CHROME_WEB_STORE_CLIENT_ID"
          [ -z "$CHROME_WEB_STORE_CLIENT_SECRET" ] && MISSING="$MISSING CHROME_WEB_STORE_CLIENT_SECRET"
          [ -z "$CHROME_WEB_STORE_REFRESH_TOKEN" ] && MISSING="$MISSING CHROME_WEB_STORE_REFRESH_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required secrets:$MISSING"
            exit 1
          fi

          echo "Obtaining OAuth access token..."
          TOKEN_RESPONSE=$(curl -s -X POST \
            -d "client_id=$CHROME_WEB_STORE_CLIENT_ID" \
            -d "client_secret=$CHROME_WEB_STORE_CLIENT_SECRET" \
            -d "refresh_token=$CHROME_WEB_STORE_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'access_token' not in data:
              print('Token error: ' + json.dumps(data), file=sys.stderr)
              sys.exit(1)
          print(data['access_token'])
          ")

          echo "::add-mask::$ACCESS_TOKEN"

          EXTENSION_ID="${{ steps.config.outputs.extension_id }}"
          PUBLISHER_ID="${{ steps.config.outputs.publisher_id }}"
          ZIP_PATH="dist/chromium/Clean-Autofill-${{ steps.version.outputs.version }}.zip"
          ITEM_NAME="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::Build artifact not found: $ZIP_PATH"
            exit 1
          fi

          echo "Uploading $ZIP_PATH..."
          UPLOAD_RESPONSE=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/zip" \
            -T "$ZIP_PATH" \
            "https://chromewebstore.googleapis.com/upload/v2/$ITEM_NAME:upload")

          UPLOAD_STATE=$(echo "$UPLOAD_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          expected = '$EXTENSION_ID'
          if data.get('itemId') != expected:
              print(f\"Unexpected item ID: {data.get('itemId')!r}\", file=sys.stderr)
              sys.exit(1)
          state = data.get('uploadState', 'UPLOAD_STATE_UNSPECIFIED')
          print(state)
          ")

          if [ "$UPLOAD_STATE" = "IN_PROGRESS" ]; then
            for ATTEMPT in $(seq 1 30); do
              echo "Upload processing, status check $ATTEMPT of 30..."
              sleep 10
              STATUS_RESPONSE=$(curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                "https://chromewebstore.googleapis.com/v2/$ITEM_NAME:fetchStatus")
              UPLOAD_STATE=$(echo "$STATUS_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          expected = '$EXTENSION_ID'
          if data.get('itemId') != expected:
              print(f\"Unexpected item ID: {data.get('itemId')!r}\", file=sys.stderr)
              sys.exit(1)
          print(data.get('lastAsyncUploadState', 'UPLOAD_STATE_UNSPECIFIED'))
          ")
              if [ "$UPLOAD_STATE" != "IN_PROGRESS" ]; then
                break
              fi
            done
          fi

          if [ "$UPLOAD_STATE" != "SUCCEEDED" ]; then
            echo "::error::Upload failed or timed out with state: $UPLOAD_STATE"
            exit 1
          fi
          echo "Upload successful"

      - name: Publish to Chrome Web Store
        if: github.event.inputs.publish == 'true'
        env:
          CHROME_WEB_STORE_CLIENT_ID: ${{ secrets.CHROME_WEB_STORE_CLIENT_ID }}
          CHROME_WEB_STORE_CLIENT_SECRET: ${{ secrets.CHROME_WEB_STORE_CLIENT_SECRET }}
          CHROME_WEB_STORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEB_STORE_REFRESH_TOKEN }}
        run: |
          echo "Obtaining OAuth access token..."
          TOKEN_RESPONSE=$(curl -s -X POST \
            -d "client_id=$CHROME_WEB_STORE_CLIENT_ID" \
            -d "client_secret=$CHROME_WEB_STORE_CLIENT_SECRET" \
            -d "refresh_token=$CHROME_WEB_STORE_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" \
            https://oauth2.googleapis.com/token)

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          if 'access_token' not in data:
              print('Token error: ' + json.dumps(data), file=sys.stderr)
              sys.exit(1)
          print(data['access_token'])
          ")

          echo "::add-mask::$ACCESS_TOKEN"

          EXTENSION_ID="${{ steps.config.outputs.extension_id }}"
          PUBLISHER_ID="${{ steps.config.outputs.publisher_id }}"
          ITEM_NAME="publishers/$PUBLISHER_ID/items/$EXTENSION_ID"

          echo "Publishing extension..."
          PUBLISH_RESPONSE=$(curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"publishType":"DEFAULT_PUBLISH","blockOnWarnings":false}' \
            "https://chromewebstore.googleapis.com/v2/$ITEM_NAME:publish")

          echo "$PUBLISH_RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          expected = '$EXTENSION_ID'
          if data.get('itemId') != expected:
              print(f\"::error::Unexpected item ID: {data.get('itemId')!r}\", file=sys.stderr)
              sys.exit(1)
          state = data.get('state', 'ITEM_STATE_UNSPECIFIED')
          accepted = {'PENDING_REVIEW', 'STAGED', 'PUBLISHED', 'PUBLISHED_TO_TESTERS'}
          if state not in accepted:
              print(f\"::error::Publish failed with state: {state}\", file=sys.stderr)
              sys.exit(1)
          for warning in data.get('warningInfo', {}).get('warnings', []):
              reason = warning.get('reason', 'warning')
              description = warning.get('description', '')
              print(f\"::warning::{reason}: {description}\")
          print(f\"Extension submission accepted with state: {state}\")
          "

      - name: Create GitHub Release
        if: github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Clean Autofill ${{ steps.version.outputs.version }}
          files: dist/chromium/Clean-Autofill-${{ steps.version.outputs.version }}.zip
          generate_release_notes: true
          make_latest: true

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Clean-Autofill-${{ steps.version.outputs.version }}
          path: dist/chromium/Clean-Autofill-${{ steps.version.outputs.version }}.zip
          retention-days: 90
